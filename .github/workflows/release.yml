name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v2.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate version
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout version
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Check tag and application version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Use a version tag such as v2.0.0.'
          }
          [xml]$project = Get-Content src/Viso/Viso.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match application version $version."
          }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  build:
    name: Test and build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ needs.version.outputs.tag }}

  release:
    name: Publish executable
    needs: [version, build]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested executable
        uses: actions/download-artifact@v8
        with:
          name: Viso-windows-x64
          path: release
      - name: Create checksum
        shell: pwsh
        run: |
          $checksum = (Get-FileHash release/Viso.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  Viso.exe" | Set-Content release/Viso.exe.sha256 -Encoding utf8NoBOM
      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG release/Viso.exe release/Viso.exe.sha256 --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG release/Viso.exe release/Viso.exe.sha256 --verify-tag --title "Viso $env:RELEASE_TAG" --generate-notes --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
